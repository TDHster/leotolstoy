<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<title>Беседа с Л. Н. Толстым</title>
<style>
  :root { --bg:#f4f1ea; --ink:#2b2622; --paper:#fffdf8; --accent:#6b4f2a;
          --muted:#8a8178; --line:#e0d8c8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: Georgia, 'Times New Roman', serif; line-height:1.55; }
  header { padding:22px 16px 10px; text-align:center; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:.3px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  #chat { max-width:760px; margin:0 auto; padding:16px; }
  .msg { margin:14px 0; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:82%; padding:12px 16px; border-radius:14px;
            white-space:pre-wrap; word-wrap:break-word; }
  .user .bubble { background:#e8e0cf; border:1px solid var(--line);
                  border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--paper); border:1px solid var(--line);
                 border-bottom-left-radius:4px; }
  .sources { max-width:82%; margin:2px 0 0; font-size:12px; color:var(--muted); }
  .sources details summary { cursor:pointer; }
  .sources > details > summary { font-weight:600; margin-bottom:4px; }
  .sources ul.srclist { margin:4px 0 0; padding-left:18px; }
  .sources li { margin:4px 0; }
  .sources .score { opacity:.6; }
  .sources blockquote { margin:6px 0 8px; padding:8px 12px; background:var(--paper);
                        border-left:3px solid var(--line); border-radius:4px;
                        color:var(--ink); font-size:13px; white-space:pre-wrap;
                        line-height:1.5; }
  .thinking { color:var(--muted); font-style:italic; }
  form { position:sticky; bottom:0; background:var(--bg);
         max-width:760px; margin:0 auto; padding:12px 16px 20px;
         display:flex; gap:8px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font-family:inherit; font-size:15px;
             padding:10px 12px; border:1px solid var(--line); border-radius:10px;
             background:var(--paper); color:var(--ink); min-height:46px; max-height:160px; }
  button { font-family:inherit; font-size:15px; padding:0 20px; border:none;
           border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <h1>Беседа с Л. Н. Толстым</h1>
  <p>Ответы составляются по его письмам и дневникам</p>
</header>

<div id="chat">
  <div class="msg bot"><div class="bubble">Здравствуйте. О чём вы желали бы поговорить? Спрашивайте о жизни, труде, вере, семье — о чём угодно.</div></div>
</div>

<form id="form">
  <textarea id="input" placeholder="Ваш вопрос…" autofocus></textarea>
  <button id="send" type="submit">Спросить</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMsg(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  chat.appendChild(wrap);
  window.scrollTo(0, document.body.scrollHeight);
  return b;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function addSources(list) {
  if (!list || !list.length) return;
  const d = document.createElement('div');
  d.className = 'sources';
  const items = list.map(s => `
    <li>
      <details>
        <summary>${esc(s.source)} <span class="score" title="Косинус угла между запросом и фрагментом: 1 — совпадение по смыслу, меньше — дальше">(cos φ = ${esc(s.score)})</span></summary>
        <blockquote>${esc(s.text)}</blockquote>
      </details>
    </li>`).join('');
  d.innerHTML = `<details open><summary>Фрагменты, на которые опирался ответ (${list.length})</summary><ul class="srclist">${items}</ul></details>`;
  chat.appendChild(d);
}

async function ask(text) {
  addMsg('user', text);
  const thinking = addMsg('bot', '…думает над ответом…');
  thinking.classList.add('thinking');
  send.disabled = true;
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    if (!r.ok) {
      const t = await r.text();
      thinking.textContent = 'Ошибка: ' + r.status + ' ' + t;
      return;
    }
    const data = await r.json();
    thinking.classList.remove('thinking');
    thinking.textContent = data.reply;
    addSources(data.sources);
  } catch (e) {
    thinking.textContent = 'Сеть недоступна: ' + e.message;
  } finally {
    send.disabled = false;
    window.scrollTo(0, document.body.scrollHeight);
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  ask(text);
});

// Enter — отправить, Shift+Enter — перенос строки
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
