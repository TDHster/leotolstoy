[project]
name = "leotolstoy-visualization"
version = "0.1.0"
description = "Интерактивная визуализация эволюции тем в письмах и дневниках Л. Н. Толстого"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.24,<3",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
    "datamapplot>=0.4",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "httpx>=0.27,<0.29",
    "python-dotenv>=1.0,<2.0",
    "pymorphy3>=1.2",
    "tqdm>=4.66",
]

[tool.uv]
package = false
