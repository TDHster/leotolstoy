services:
  tolstoy:
    build: .
    container_name: tolstoy-chat
    restart: unless-stopped
    # корректная обработка сигналов и reaping зомби-процессов (долгий аптайм)
    init: true
    # HTTP на localhost:8000 (TLS терминирует Caddy reverse proxy).
    # Напрямую доступ: curl http://localhost:8000/health
    # Через Caddy: https://verbatis.ru
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      # индекс (собран локально, перенесён на сервер) — read-only
      - ./index:/app/index:ro
      # индекс для внешней модели Qwen (если есть) — read-only
      - ./index.qwen3-embedding-8b:/app/index.qwen3-embedding-8b:ro
      # кэш модели эмбеддингов: качается один раз, переживает пересборки
      - model_cache:/app/model_cache
    # придерживаем память на маленьком сервере (4 ГБ RAM).
    # mem_reservation — мягкий порог (планировщик Docker учитывает при нехватке),
    # mem_limit — жёсткий потолок (при превышении OOM-kill → healthcheck+restart поднимут).
    # MiniLM-L12-v2: модель ~120 МБ + индекс ~30 МБ (19.6k чанков) + рантайм ~300 МБ.
    # Qwen3-8B: без локальной модели, float32-индекс ~1.4 ГБ (пик ~2 ГБ с chunks
    # и рантаймом). Лимиты подняты под float32 (было 2000m — не хватало).
    mem_reservation: 2000m
    mem_limit: 3000m
    # ротация логов: максимум 3 файла по 10 МБ = не более 30 МБ на диске.
    # Без этого Docker пишет JSON-лог бесконечно и забивает диск.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # проверка живости: если /health не отвечает — Docker пометит unhealthy
    # и (с restart: unless-stopped) перезапустит зависший контейнер.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=4)"]
      interval: 300s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  model_cache:
